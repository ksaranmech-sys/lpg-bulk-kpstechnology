<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fleet Trip Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LICENSE SCREEN ===================== -->
<div id="screen-license" class="center-screen hidden">
  <div class="auth-card">
    <h1>Activate</h1>
    <div class="tag">Enter the license key your developer issued for this company.</div>
    <div id="licenseError" class="error-msg hidden"></div>
    <div class="field">
      <label for="licenseInput">License key</label>
      <input id="licenseInput" placeholder="TRK-XXXX-YYYYMMDD-XXXXX" autocomplete="off">
    </div>
    <button class="full amber" onclick="App.submitLicense()">Activate</button>
  </div>
</div>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="screen-login" class="center-screen hidden">
  <div class="auth-card">
    <h1 id="loginCompanyName">Fleet Trip Manager</h1>
    <div class="tag">Sign in to record and review trips.</div>
    <div id="loginError" class="error-msg hidden"></div>
    <div id="licenseWarning" class="info-msg hidden"></div>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="full amber" onclick="App.submitLogin()">Sign in</button>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="screen-app" class="hidden">
  <header id="appHeader">
    <div class="company">
      <span id="hdrCompanyName">Company</span>
      <small id="hdrLicenseNote"></small>
    </div>
    <div class="who">
      <span id="hdrUserInfo"></span>
      <span class="role-pill" id="hdrRolePill">ROLE</span>
      <button class="secondary small" style="border-color:var(--paper);color:var(--paper)" onclick="App.logout()">Sign out</button>
    </div>
  </header>

  <main id="mainContent">
    <!-- Filled dynamically by app.js depending on screen/role -->
  </main>

  <footer class="app-footer">Fleet Trip Manager — offline, single-company edition</footer>
</div>

<script src="config.js"></script>
<script src="license.js"></script>
<script src="app.js"></script>
</body>
</html>
