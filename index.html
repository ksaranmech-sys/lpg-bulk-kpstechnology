<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPS Technology — Trip &amp; Fleet Register</title>
<style>
:root{
  --ink:#1B2027;
  --plate:#262E38;
  --plate-2:#2E3944;
  --line:#3D4854;
  --paper:#EDE7DA;
  --paper-2:#F6F2E9;
  --amber:#E8A33D;
  --amber-dim:#8A6323;
  --red:#C1443C;
  --green:#4C7A5C;
  --ink-text:#DCE1E7;
  --dim-text:#8B96A3;
  --font-display:"Space Grotesk","IBM Plex Sans",Arial,sans-serif;
  --font-body:"IBM Plex Sans",Arial,sans-serif;
  --font-mono:"IBM Plex Mono","Courier New",monospace;
}
@font-face{font-family:"Space Grotesk";src:local("Space Grotesk");}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--ink-text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
a{color:var(--amber);}
::selection{background:var(--amber);color:var(--ink);}
button, input, select, textarea{font-family:inherit;font-size:inherit;color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0 0 6px 0;letter-spacing:0.2px;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(180deg, rgba(27,32,39,0.92), rgba(27,32,39,0.97)),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(232,163,61,0.06) 78px 82px);
}
.login-box{
  width:380px;
  max-width:92vw;
  border:1px solid var(--line);
  background:var(--plate);
  padding:34px 32px 28px;
  position:relative;
}
.login-box::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:4px;
  background:repeating-linear-gradient(90deg, var(--amber) 0 18px, var(--ink) 18px 30px);
}
.brandmark{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--amber);
  letter-spacing:2px;
  margin-bottom:2px;
}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-wrap img{max-height:44px;max-width:180px;object-fit:contain;}
.sidebar .logo-wrap img{max-height:34px;max-width:150px;}
.logo-upload-box{border:1px dashed var(--line);padding:20px;text-align:center;}
.logo-preview-current{background:var(--ink);border:1px solid var(--line);padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.logo-preview-current img{max-height:60px;max-width:220px;object-fit:contain;}
.report-sheet .logo-wrap img{max-height:56px;}
.login-box h1{font-size:26px;color:#fff;margin-bottom:4px;}
.login-sub{color:var(--dim-text);font-size:12.5px;margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--dim-text);margin-bottom:5px;text-transform:none;}
.field input, .field select, .field textarea{
  width:100%;
  background:var(--ink);
  border:1px solid var(--line);
  padding:10px 11px;
  color:#fff;
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber);}
.btn{
  display:inline-block;
  background:var(--amber);
  color:#1B2027;
  border:none;
  padding:10px 18px;
  font-weight:600;
  cursor:pointer;
  font-family:var(--font-display);
  letter-spacing:0.3px;
}
.btn:hover{background:#f0b158;}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink-text);}
.btn.secondary:hover{border-color:var(--amber);color:var(--amber);}
.btn.danger{background:var(--red);color:#fff;}
.btn.small{padding:6px 12px;font-size:12.5px;}
.btn.block{width:100%;}
.login-error{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
.login-hint{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--dim-text);}
.login-hint b{color:var(--ink-text);}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:220px;
  flex-shrink:0;
  background:var(--plate);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:20px 0;
}
.sidebar .brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.sidebar .brand .brandmark{margin-bottom:6px;}
.sidebar .brand .company{font-family:var(--font-display);font-size:17px;color:#fff;}
.sidebar .brand .user-tag{margin-top:10px;font-size:11.5px;color:var(--dim-text);}
.sidebar .brand .user-tag .role-pill{
  display:inline-block;margin-top:4px;padding:2px 8px;font-size:10.5px;
  border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--font-mono);letter-spacing:1px;
}
.nav-item{
  padding:11px 20px;
  color:var(--dim-text);
  cursor:pointer;
  border-left:3px solid transparent;
  font-size:13.5px;
  display:flex;align-items:center;gap:10px;
}
.nav-item:hover{color:var(--ink-text);background:rgba(255,255,255,0.02);}
.nav-item.active{color:#fff;border-left-color:var(--amber);background:rgba(232,163,61,0.07);}
.nav-item .dot{width:6px;height:6px;background:var(--red);border-radius:50%;display:none;}
.nav-item .dot.show{display:inline-block;}
.sidebar-foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);}

.main{flex:1;padding:28px 34px;overflow-x:hidden;max-width:100%;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-head .eyebrow-num{font-family:var(--font-mono);color:var(--amber);font-size:12px;}
.panel{
  background:var(--plate);
  border:1px solid var(--line);
  padding:22px;
  margin-bottom:20px;
}
.panel h3{color:#fff;font-size:15px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{
  text-align:left;font-family:var(--font-mono);font-weight:400;font-size:11px;
  color:var(--dim-text);padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:0.5px;
}
table td{padding:9px 10px;border-bottom:1px solid rgba(61,72,84,0.5);vertical-align:top;}
table tr:hover td{background:rgba(255,255,255,0.015);}
.mono{font-family:var(--font-mono);}
.num{font-family:var(--font-mono);}

.badge{display:inline-block;padding:2px 9px;font-size:10.5px;font-family:var(--font-mono);letter-spacing:0.8px;border:1px solid;}
.badge.open{color:var(--amber);border-color:var(--amber-dim);}
.badge.closed{color:var(--green);border-color:var(--green);}
.badge.due{color:var(--red);border-color:var(--red);}
.badge.ok{color:var(--dim-text);border-color:var(--line);}
.badge.admin{color:var(--amber);border-color:var(--amber-dim);}
.badge.user{color:var(--ink-text);border-color:var(--line);}

.entry-row{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;border:1px solid var(--line);margin-bottom:10px;background:rgba(0,0,0,0.15);}
.entry-row .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
.remove-x{color:var(--red);cursor:pointer;font-size:12px;font-family:var(--font-mono);text-align:right;}
.thumb{width:52px;height:52px;object-fit:cover;border:1px solid var(--line);vertical-align:middle;}
.gps-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--green);}

.empty-note{color:var(--dim-text);font-size:13px;padding:16px 0;text-align:center;border:1px dashed var(--line);}
.section-divider{margin:26px 0 16px;font-family:var(--font-mono);font-size:11px;color:var(--amber);letter-spacing:1.5px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.summary-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.summary-line.total{border-bottom:none;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:15px;color:#fff;font-weight:600;}
.summary-line.total .num{color:var(--amber);}

.alert-strip{border-left:4px solid var(--red);background:rgba(193,68,60,0.09);padding:10px 14px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.alert-strip.warn{border-left-color:var(--amber);background:rgba(232,163,61,0.08);}
.alert-strip .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--dim-text);}

.tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tab{padding:9px 16px;cursor:pointer;color:var(--dim-text);font-size:13px;border-bottom:2px solid transparent;}
.tab.active{color:#fff;border-bottom-color:var(--amber);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,12,15,0.72);z-index:50;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--plate);border:1px solid var(--line);width:520px;max-width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
.modal h3{color:#fff;margin-bottom:16px;}
.modal-close{position:absolute;}
.close-x{float:right;cursor:pointer;color:var(--dim-text);font-family:var(--font-mono);}
.close-x:hover{color:var(--red);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--plate);border:1px solid var(--amber);color:#fff;padding:12px 18px;font-size:13px;z-index:100;display:none;}
.toast.show{display:block;}

.vehicle-chip{display:inline-block;background:var(--ink);border:1px solid var(--line);padding:3px 9px;margin:2px 4px 2px 0;font-family:var(--font-mono);font-size:11.5px;}

/* print report */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;background:#fff;color:#111;padding:20px;}
}
.report-sheet{background:var(--paper);color:#1B2027;font-family:var(--font-body);}
.report-sheet h2{font-family:var(--font-display);border-bottom:2px solid #1B2027;padding-bottom:8px;}
.report-sheet table td, .report-sheet table th{border-color:#c9c2ae;color:#1B2027;}
.report-sheet .summary-line{border-color:#c9c2ae;}
.report-sheet .summary-line.total{color:#1B2027;}
.report-sheet .summary-line.total .num{color:#8A5A1E;}

.field-note{font-size:11px;color:var(--dim-text);margin-top:3px;}
textarea{resize:vertical;}
.flexrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.spacer{flex:1;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo-wrap" id="loginLogoWrap"><div class="brandmark">KPS TECHNOLOGY</div></div>
    <h1>Trip &amp; Fleet Register</h1>
    <div class="login-sub">Sign in to manage trucks, trips and document reminders.</div>
    <div class="field">
      <label>Username</label>
      <input id="loginUser" type="text" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="btn block" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">
      First time here? Default administrator login —<br>
      <b>Username:</b> admin &nbsp; <b>Password:</b> kps@admin1<br>
      Change this password immediately after signing in.
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">
        <div class="logo-wrap" id="sideLogoWrap"><div class="brandmark">KPS TECHNOLOGY</div></div>
        <div class="company">Fleet Register</div>
        <div class="user-tag" id="sideUserTag"></div>
      </div>
      <div id="navItems"></div>
      <div class="sidebar-foot">
        <button class="btn secondary block small" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<!-- printable report target -->
<div id="printArea"></div>

<!-- generic modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

/* ---------------- storage layer ---------------- */
const DB = {
  load(key, fallback){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v): fallback; }catch(e){ return fallback; } },
  save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};

function getUsers(){ return DB.load("kps_users", null) || seedUsers(); }
function saveUsers(u){ DB.save("kps_users", u); }
function getCustomers(){ return DB.load("kps_customers", []); }
function saveCustomers(c){ DB.save("kps_customers", c); }
function getTrips(){ return DB.load("kps_trips", []); }
function saveTrips(t){ DB.save("kps_trips", t); }
function getDocs(){ return DB.load("kps_documents", []); }
function saveDocs(d){ DB.save("kps_documents", d); }
function getLogo(){
  const raw = DB.load("kps_logo", undefined);
  if(raw === undefined) return DEFAULT_LOGO; // nothing saved yet -> use the baked-in KPS logo
  return raw; // "" means explicitly removed (show text mark); a data URL means a custom upload
}
function saveLogo(dataUrl){ DB.save("kps_logo", dataUrl); }

function renderLogoSlots(){
  const logo = getLogo();
  const html = logo
    ? `<img src="${logo}" alt="${COMPANY.name} logo">`
    : `<div class="brandmark">KPS TECHNOLOGY</div>`;
  const loginSlot = document.getElementById("loginLogoWrap");
  const sideSlot = document.getElementById("sideLogoWrap");
  if(loginSlot) loginSlot.innerHTML = html;
  if(sideSlot) sideSlot.innerHTML = html;
}

function seedUsers(){
  const u = [{ id: uid(), username:"admin", password:"kps@admin1", role:"admin", name:"Administrator" }];
  saveUsers(u);
  return u;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtMoney(n){ n = Number(n)||0; return "₹" + n.toLocaleString("en-IN",{maximumFractionDigits:2}); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

let SESSION = DB.load("kps_session", null);

function doLogin(){
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const users = getUsers();
  const found = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
  if(!found){
    document.getElementById("loginError").textContent = "Incorrect username or password.";
    return;
  }
  SESSION = { userId: found.id };
  DB.save("kps_session", SESSION);
  boot();
}

function logout(){
  SESSION = null;
  localStorage.removeItem("kps_session");
  location.reload();
}

function currentUser(){
  return getUsers().find(u => u.id === SESSION.userId);
}

/* ---------------- boot / routing ---------------- */
let ROUTE = "dashboard";

function boot(){
  renderLogoSlots();
  if(!SESSION || !currentUser()){
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    return;
  }
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  const u = currentUser();
  document.getElementById("sideUserTag").innerHTML =
    u.name + " (" + u.username + ")<br><span class='role-pill'>" + u.role.toUpperCase() + "</span>";
  renderNav();
  navigate(u.role === "admin" ? "dashboard" : "trips");
}

function renderNav(){
  const u = currentUser();
  const dueCount = upcomingReminders().filter(r=>r.status!=="ok").length;
  let items = [];
  if(u.role === "admin"){
    items = [
      ["dashboard","Dashboard"],
      ["customers","Customers"],
      ["users","Users & Access"],
      ["trips","Trips"],
      ["reminders","Document Reminders"],
      ["settings","Company Settings"]
    ];
  } else {
    items = [
      ["trips","My Vehicle Trips"],
      ["reminders","Document Reminders"]
    ];
  }
  const nav = document.getElementById("navItems");
  nav.innerHTML = items.map(([key,label]) => {
    const dot = key === "reminders" && dueCount>0 ? "<span class='dot show'></span>" : "";
    return `<div class="nav-item ${ROUTE===key?'active':''}" onclick="navigate('${key}')">${label}${dot}</div>`;
  }).join("");
}

function navigate(route){
  ROUTE = route;
  renderNav();
  const main = document.getElementById("mainArea");
  const u = currentUser();
  if(route==="dashboard" && u.role==="admin") return renderDashboard();
  if(route==="customers" && u.role==="admin") return renderCustomers();
  if(route==="users" && u.role==="admin") return renderUsers();
  if(route==="trips") return renderTrips();
  if(route==="reminders") return renderReminders();
  if(route==="settings" && u.role==="admin") return renderSettings();
  main.innerHTML = "<div class='empty-note'>Not found.</div>";
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
function openModal(html){
  document.getElementById("modalBody").innerHTML = "<span class='close-x' onclick='closeModal()'>[ close ]</span>" + html;
  document.getElementById("modalBg").classList.add("show");
}

/* ====================================================================
   ADMIN DASHBOARD
   ==================================================================== */
function renderDashboard(){
  const customers = getCustomers();
  const trips = getTrips();
  const openTrips = trips.filter(t=>t.status==="open");
  const dueDocs = upcomingReminders().filter(r=>r.status!=="ok");
  const totalVehicles = customers.reduce((s,c)=>s+c.vehicles.length,0);

  document.getElementById("mainArea").innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow-num">OVERVIEW</div><h2>Dashboard</h2></div>
    </div>
    <div class="grid3">
      <div class="panel"><h3>Customers</h3><div style="font-size:34px;font-family:var(--font-mono);color:#fff;">${customers.length}</div><div class="field-note">${totalVehicles} vehicle(s) registered</div></div>
      <div class="panel"><h3>Open Trips</h3><div style="font-size:34px;font-family:var(--font-mono);color:var(--amber);">${openTrips.length}</div><div class="field-note">${trips.length} total trips logged</div></div>
      <div class="panel"><h3>Documents Due</h3><div style="font-size:34px;font-family:var(--font-mono);color:${dueDocs.length?'var(--red)':'var(--green)'};">${dueDocs.length}</div><div class="field-note">needing renewal / reminder</div></div>
    </div>
    <div class="panel">
      <h3>Recent trips</h3>
      ${ trips.length===0 ? "<div class='empty-note'>No trips recorded yet.</div>" : renderTripTable(trips.slice().reverse().slice(0,8)) }
    </div>
  `;
}

/* ====================================================================
   CUSTOMERS
   ==================================================================== */
function renderCustomers(){
  const customers = getCustomers();
  document.getElementById("mainArea").innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow-num">ACCOUNTS</div><h2>Customers</h2></div>
      <button class="btn" onclick="openCustomerForm()">+ Add customer</button>
    </div>
    <div class="panel">
      ${ customers.length===0 ? "<div class='empty-note'>No customers added yet.</div>" :
      `<table><thead><tr><th>Name</th><th>Vehicles</th><th>Mobile</th><th>Email</th><th></th></tr></thead><tbody>
      ${customers.map(c=>`
        <tr>
          <td>${esc(c.name)}</td>
          <td>${c.vehicles.map(v=>`<span class="vehicle-chip">${esc(v)}</span>`).join("")}</td>
          <td class="mono">${esc(c.mobile)}</td>
          <td>${esc(c.email)}</td>
          <td><span class="remove-x" onclick="openCustomerForm('${c.id}')">edit</span> &nbsp; <span class="remove-x" onclick="deleteCustomer('${c.id}')">delete</span></td>
        </tr>`).join("")}
      </tbody></table>` }
    </div>
  `;
}

function openCustomerForm(id){
  const customers = getCustomers();
  const c = id ? customers.find(x=>x.id===id) : null;
  openModal(`
    <h3>${c?"Edit customer":"Add customer"}</h3>
    <div class="field"><label>Customer name</label><input id="cf_name" value="${c?esc(c.name):''}"></div>
    <div class="field"><label>Vehicle numbers (comma separated)</label><input id="cf_vehicles" value="${c?c.vehicles.join(', '):''}" placeholder="e.g. TN45AB1234, TN45CD5678"></div>
    <div class="field"><label>Mobile number</label><input id="cf_mobile" value="${c?esc(c.mobile):''}"></div>
    <div class="field"><label>Customer email address</label><input id="cf_email" value="${c?esc(c.email):''}"></div>
    <button class="btn block" onclick="saveCustomer('${c?c.id:''}')">${c?"Save changes":"Add customer"}</button>
  `);
}

function saveCustomer(id){
  const name = document.getElementById("cf_name").value.trim();
  const vehicles = document.getElementById("cf_vehicles").value.split(",").map(v=>v.trim().toUpperCase()).filter(Boolean);
  const mobile = document.getElementById("cf_mobile").value.trim();
  const email = document.getElementById("cf_email").value.trim();
  if(!name || vehicles.length===0){ toast("Name and at least one vehicle number are required."); return; }
  let customers = getCustomers();
  if(id){
    customers = customers.map(c=> c.id===id ? {...c, name, vehicles, mobile, email} : c);
  } else {
    customers.push({ id: uid(), name, vehicles, mobile, email });
  }
  saveCustomers(customers);
  closeModal();
  toast("Customer saved.");
  renderCustomers();
}

function deleteCustomer(id){
  if(!confirm("Delete this customer? Their trip history stays but will no longer be linked.")) return;
  saveCustomers(getCustomers().filter(c=>c.id!==id));
  renderCustomers();
}

    </div>
    <div class="panel">
      <table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Access</th><th>Customer</th><th></th></tr></thead><tbody>
      ${users.map(u=>{
        const cust = customers.find(c=>c.id===u.customerId);
        return `<tr>
          <td>${esc(u.name||"—")}</td>

          <td><span class="badge ${u.role}">${u.role.toUpperCase()}</span></td>

          <td>${u.username==='admin'?'':'<span class="remove-x" onclick="openUserForm(\''+u.id+'\')">edit</span> &nbsp; <span class="remove-x" onclick="deleteUser(\''+u.id+'\')">delete</span>'}</td>
        </tr>`;
      }).join("")}
      </tbody></table>
    </div>
    <div class="panel">
      <h3>About access rights</h3>
      <p class="field-note" style="font-size:12.5px;">
      <b>Admin</b> logins can see every customer, every vehicle, and every trip, and can manage users, customers and document reminders.<br><br>
      <b>User</b> logins belong to one customer and are restricted to a single vehicle — they can log and view trips for that vehicle only.
      </p>

}

function openUserForm(id){
  const users = getUsers();
  const customers = getCustomers();
  const u = id ? users.find(x=>x.id===id) : null;
  const custOptions = customers.map(c=>`<option value="${c.id}" ${u&&u.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join("");
  openModal(`
    <h3>${u?"Edit login":"Create login"}</h3>
    <div class="field"><label>Full name</label><input id="uf_name" value="${u?esc(u.name||''):''}"></div>
    <div class="field"><label>Username</label><input id="uf_username" value="${u?esc(u.username):''}" ${u?'':''}></div>
    <div class="field"><label>Password</label><input id="uf_password" type="text" value="${u?esc(u.password):''}" placeholder="set a password"></div>
    <div class="field"><label>Role</label>
      <select id="uf_role" onchange="toggleUserRoleFields()">
        <option value="admin" ${u&&u.role==='admin'?'selected':''}>Admin — full access</option>
        <option value="user" ${!u||u.role==='user'?'selected':''}>User — single vehicle only</option>
      </select>
    </div>
    <div id="uf_userFields">
      <div class="field"><label>Customer</label><select id="uf_customer" onchange="refreshUserVehicleOptions()">${custOptions || '<option value="">— add a customer first —</option>'}</select></div>
      <div class="field"><label>Assigned vehicle</label><select id="uf_vehicle"></select></div>
    </div>
    <button class="btn block" onclick="saveUser('${u?u.id:''}')">${u?"Save changes":"Create login"}</button>
  `);
  toggleUserRoleFields();
  if(customers.length){ refreshUserVehicleOptions(u ? u.vehicle : null); }
}

function toggleUserRoleFields(){
  const role = document.getElementById("uf_role").value;
  document.getElementById("uf_userFields").style.display = role==="user" ? "block" : "none";
}

function refreshUserVehicleOptions(selected){
  const customers = getCustomers();
  const custId = document.getElementById("uf_customer").value;
  const cust = customers.find(c=>c.id===custId);
  const sel = document.getElementById("uf_vehicle");
  sel.innerHTML = cust ? cust.vehicles.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join("") : "";
}

function saveUser(id){
  const name = document.getElementById("uf_name").value.trim();
  const username = document.getElementById("uf_username").value.trim();
  const password = document.getElementById("uf_password").value;
  const role = document.getElementById("uf_role").value;
  if(!username || !password){ toast("Username and password are required."); return; }
  let users = getUsers();
  if(users.some(u => u.username.toLowerCase()===username.toLowerCase() && u.id!==id)){
    toast("That username is already taken."); return;
  }
  let record = { name, username, password, role };
  if(role==="user"){
    record.customerId = document.getElementById("uf_customer").value;
    record.vehicle = document.getElementById("uf_vehicle").value;
    if(!record.customerId || !record.vehicle){ toast("Select a customer and vehicle for a user login."); return; }
  }
  if(id){
    users = users.map(u=> u.id===id ? {...u, ...record} : u);
  } else {
    users.push({ id: uid(), ...record });
  }
  saveUsers(users);
  closeModal();
  toast("Login saved.");
  renderUsers();
}

function deleteUser(id){
  if(!confirm("Remove this login?")) return;
  saveUsers(getUsers().filter(u=>u.id!==id));
  renderUsers();
}

/* ====================================================================
   TRIPS
   ==================================================================== */
function scopedVehicles(){
  const u = currentUser();
  const customers = getCustomers();
  if(u.role==="admin") return customers.flatMap(c=>c.vehicles.map(v=>({vehicle:v, customer:c})));
  return [{ vehicle: u.vehicle, customer: customers.find(c=>c.id===u.customerId) }];
}

function vehicleTrips(vehicle){
  return getTrips().filter(t=>t.vehicle===vehicle).sort((a,b)=>a.createdAt-b.createdAt);
}

function renderTrips(){
  const u = currentUser();
  const vList = scopedVehicles();
  let vehicleFilter = window._tripVehicleFilter || (vList[0] ? vList[0].vehicle : null);
  window._tripVehicleFilter = vehicleFilter;

  const options = vList.map(v=>`<option value="${v.vehicle}" ${v.vehicle===vehicleFilter?'selected':''}>${v.vehicle} — ${v.customer?v.customer.name:'unassigned'}</option>`).join("");
  const trips = vehicleFilter ? vehicleTrips(vehicleFilter) : [];
  const openTrip = trips.find(t=>t.status==="open");

  document.getElementById("mainArea").innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow-num">${u.role==='admin'?'ALL VEHICLES':'ASSIGNED VEHICLE'}</div><h2>Trips</h2></div>
      ${vList.length>1 ? `<select id="vehicleSelect" onchange="window._tripVehicleFilter=this.value; renderTrips();" style="background:var(--plate);border:1px solid var(--line);color:#fff;padding:8px 10px;">${options}</select>` : ''}
    </div>

    ${!vehicleFilter ? "<div class='empty-note'>No vehicle assigned yet — ask an admin to set this up.</div>" : `
      <div class="panel">
        <h3>Vehicle ${vehicleFilter}</h3>
        ${ openTrip
          ? `<div class="flexrow"><span class="badge open">TRIP OPEN</span><span class="field-note">Started ${fmtDate(openTrip.advance.date||todayISO())} at ${esc(openTrip.loadingLocation||'—')}</span><span class="spacer"></span><button class="btn small" onclick="openTripWorkspace('${openTrip.id}')">Continue trip entry</button></div>`
          : `<div class="flexrow"><span class="field-note">No open trip on this vehicle right now.</span><span class="spacer"></span><button class="btn small" onclick="startTrip('${vehicleFilter}')">+ Start new trip</button></div>`
        }
      </div>

      <div class="section-divider">TRIP HISTORY — ${esc(vehicleFilter)}</div>
      <div class="panel">
        ${trips.length===0 ? "<div class='empty-note'>No trips logged for this vehicle yet.</div>" : renderTripTable(trips.slice().reverse())}
      </div>
    `}
  `;
}

function renderTripTable(trips){
  return `<table><thead><tr><th>Vehicle</th><th>Loading</th><th>Unloading</th><th>Advance</th><th>Status</th><th></th></tr></thead><tbody>
  ${trips.map(t=>`
    <tr>
      <td class="mono">${esc(t.vehicle)}</td>
      <td>${esc(t.loadingLocation||'—')}</td>
      <td>${esc(t.unloadingLocation||'—')}</td>
      <td class="num">${fmtMoney(t.advance.amount)}</td>
      <td><span class="badge ${t.status}">${t.status.toUpperCase()}</span></td>
      <td><span class="remove-x" onclick="openTripWorkspace('${t.id}')">open</span></td>
    </tr>`).join("")}
  </tbody></table>`;
}

function startTrip(vehicle){
  const trips = getTrips();
  const trip = {
    id: uid(),
    vehicle,
    status:"open",
    createdAt: Date.now(),
    advance:{ amount:0, date: todayISO() },
    loadingLocation:"",
    loadingExpense:0,
    dieselEntries:[],
    rtoEntries:[],
    unloadingLocation:"",
    unloadingExpense:0,
    otherExpenses:[]
  };
  trips.push(trip);
  saveTrips(trips);
  openTripWorkspace(trip.id);
}

function getTrip(id){ return getTrips().find(t=>t.id===id); }
function updateTrip(id, patch){
  const trips = getTrips().map(t=> t.id===id ? {...t, ...patch} : t);
  saveTrips(trips);
}
function mutateTrip(id, fn){
  const trips = getTrips();
  const idx = trips.findIndex(t=>t.id===id);
  if(idx<0) return;
  fn(trips[idx]);
  saveTrips(trips);
}

function openTripWorkspace(tripId){
  const trip = getTrip(tripId);
  if(!trip) return navigate("trips");
  const locOptions = arr => arr.map(l=>`<option ${trip.loadingLocation===l?'':''}>${l}</option>`).join("");

  document.getElementById("mainArea").innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow-num">TRIP WORKSPACE</div><h2>${esc(trip.vehicle)} <span class="badge ${trip.status}" style="margin-left:8px;">${trip.status.toUpperCase()}</span></h2></div>
      <button class="btn secondary small" onclick="navigate('trips')">&larr; back to trips</button>
    </div>

    <div class="panel">
      <h3>Driver advance</h3>
      <div class="grid2">
        <div class="field"><label>Advance amount (Rs)</label><input type="number" id="tf_advance" value="${trip.advance.amount}" ${trip.status==='closed'?'disabled':''}></div>
        <div class="field"><label>Date</label><input type="date" id="tf_advanceDate" value="${trip.advance.date}" ${trip.status==='closed'?'disabled':''}></div>
      </div>
      ${trip.status==='open' ? `<button class="btn small" onclick="saveAdvance('${trip.id}')">Save advance</button>` : ''}
    </div>

    <div class="panel">
      <h3>Loading</h3>
      <div class="grid2">
        <div class="field"><label>Loading location</label>
          <select id="tf_loadLoc" ${trip.status==='closed'?'disabled':''}>
            <option value="">— select —</option>
            ${LOADING_LOCATIONS.map(l=>`<option value="${l}" ${trip.loadingLocation===l?'selected':''}>${l}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Loading expense — cleaner (Rs)</label><input type="number" id="tf_loadExp" value="${trip.loadingExpense}" ${trip.status==='closed'?'disabled':''}></div>
      </div>
      ${trip.status==='open' ? `<button class="btn small" onclick="saveLoading('${trip.id}')">Save loading details</button>` : ''}
    </div>

    <div class="panel">
      <h3>Diesel filling entries</h3>
      <div id="dieselEntries">${renderDieselEntries(trip)}</div>
      ${trip.status==='open' ? `<button class="btn secondary small" onclick="addDieselEntry('${trip.id}')">+ Add diesel fill</button>` : ''}
      <div class="field-note">The first fill of a trip is excluded from that trip's diesel &amp; mileage calculation. It is combined with the closing fill made at the next loading point instead — see the trip report for the worked calculation.</div>
    </div>

    <div class="panel">
      <h3>RTO entries</h3>
      <div id="rtoEntries">${renderRtoEntries(trip)}</div>
      ${trip.status==='open' ? `<button class="btn secondary small" onclick="addRtoEntry('${trip.id}')">+ Add RTO entry</button>` : ''}
    </div>

    <div class="panel">
      <h3>Unloading</h3>
      <div class="grid2">
        <div class="field"><label>Unloading location</label>
          <select id="tf_unloadLoc" ${trip.status==='closed'?'disabled':''}>
            <option value="">— select —</option>
            ${UNLOADING_LOCATIONS.map(l=>`<option value="${l}" ${trip.unloadingLocation===l?'selected':''}>${l}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Unloading expense — cleaner (Rs)</label><input type="number" id="tf_unloadExp" value="${trip.unloadingExpense}" ${trip.status==='closed'?'disabled':''}></div>
      </div>
      ${trip.status==='open' ? `<button class="btn small" onclick="saveUnloading('${trip.id}')">Save unloading details</button>` : ''}
    </div>

    <div class="panel">
      <h3>Other expenses</h3>
      <div id="otherEntries">${renderOtherEntries(trip)}</div>
      ${trip.status==='open' ? `<button class="btn secondary small" onclick="addOtherEntry('${trip.id}')">+ Add other expense</button>` : ''}
    </div>

    ${trip.status==='open' ? `
    <div class="panel">
      <h3>Close this trip</h3>
      <p class="field-note" style="font-size:12.5px;">A trip closes once diesel is filled again at the next loading location. Start the next trip below — its first diesel fill will complete this trip's mileage calculation automatically.</p>
      <button class="btn" onclick="closeTripAndStartNext('${trip.id}')">Close trip &amp; start next trip</button>
    </div>` : ''}

    <div class="panel">
      <h3>Settlement &amp; report</h3>
      <div id="settlementBox">${renderSettlement(trip)}</div>
      <div class="flexrow" style="margin-top:14px;">
        <button class="btn secondary small" onclick="printTripReport('${trip.id}')">Print / Save as PDF</button>
        <button class="btn secondary small" onclick="emailTripReport('${trip.id}')">Send to company mail</button>
      </div>
    </div>
  `;
}

function saveAdvance(tripId){
  const amount = Number(document.getElementById("tf_advance").value)||0;
  const date = document.getElementById("tf_advanceDate").value || todayISO();
  updateTrip(tripId, { advance:{amount,date} });
  toast("Advance saved."); openTripWorkspace(tripId);
}
function saveLoading(tripId){
  const loadingLocation = document.getElementById("tf_loadLoc").value;
  const loadingExpense = Number(document.getElementById("tf_loadExp").value)||0;
  updateTrip(tripId, { loadingLocation, loadingExpense });
  toast("Loading details saved."); openTripWorkspace(tripId);
}
function saveUnloading(tripId){
  const unloadingLocation = document.getElementById("tf_unloadLoc").value;
  const unloadingExpense = Number(document.getElementById("tf_unloadExp").value)||0;
  updateTrip(tripId, { unloadingLocation, unloadingExpense });
  toast("Unloading details saved."); openTripWorkspace(tripId);
}

/* ---- diesel entries ---- */
function renderDieselEntries(trip){
  if(trip.dieselEntries.length===0) return "<div class='empty-note'>No diesel fills recorded yet.</div>";
  return trip.dieselEntries.map((e,i)=>`
    <div class="entry-row">
      <div class="flexrow"><b>Fill #${i+1}</b>${i===0?"<span class='field-note'>(excluded from this trip's diesel total — see note)</span>":""}<span class="spacer"></span>${trip.status==='open'?`<span class="remove-x" onclick="removeDieselEntry('${trip.id}','${e.id}')">remove</span>`:''}</div>
      <div class="cols">
        <div>Volume (L)<br><span class="num">${e.volume}</span></div>
        <div>Rate (Rs/L)<br><span class="num">${e.rate}</span></div>
        <div>Value (Rs)<br><span class="num">${fmtMoney(e.value)}</span></div>
        <div>Odometer (km)<br><span class="num">${e.km||'—'}</span></div>
        <div>Photo<br>${e.photo?`<img class="thumb" src="${e.photo}">`:'—'}</div>
      </div>
    </div>`).join("");
}
function addDieselEntry(tripId){
  openModal(`
    <h3>Add diesel fill</h3>
    <div class="grid2">
      <div class="field"><label>Volume (Litres)</label><input type="number" id="de_vol" oninput="calcDieselValue()"></div>
      <div class="field"><label>Rate (Rs / Litre)</label><input type="number" id="de_rate" oninput="calcDieselValue()"></div>
    </div>
    <div class="field"><label>Value (Rs)</label><input type="number" id="de_value"></div>
    <div class="field"><label>Odometer reading (km) — optional</label><input type="number" id="de_km"></div>
    <div class="field"><label>Photo (camera or upload) — optional</label><input type="file" accept="image/*" capture="environment" id="de_photo"></div>
    <button class="btn block" onclick="saveDieselEntry('${tripId}')">Add fill</button>
  `);
}
function calcDieselValue(){
  const v = Number(document.getElementById("de_vol").value)||0;
  const r = Number(document.getElementById("de_rate").value)||0;
  document.getElementById("de_value").value = (v*r) ? (v*r).toFixed(2) : "";
}
function saveDieselEntry(tripId){
  const volume = Number(document.getElementById("de_vol").value)||0;
  const rate = Number(document.getElementById("de_rate").value)||0;
  const value = Number(document.getElementById("de_value").value)||(volume*rate);
  const km = document.getElementById("de_km").value ? Number(document.getElementById("de_km").value) : null;
  const file = document.getElementById("de_photo").files[0];
  const finish = (photo)=>{
    mutateTrip(tripId, t=>{ t.dieselEntries.push({id:uid(), volume, rate, value, km, photo:photo||null, ts:Date.now()}); });
    closeModal(); toast("Diesel fill recorded."); openTripWorkspace(tripId);
  };
  if(file){ fileToDataUrl(file, finish); } else { finish(null); }
}
function removeDieselEntry(tripId, entryId){
  mutateTrip(tripId, t=>{ t.dieselEntries = t.dieselEntries.filter(e=>e.id!==entryId); });
  openTripWorkspace(tripId);
}

/* ---- RTO entries ---- */
function renderRtoEntries(trip){
  if(trip.rtoEntries.length===0) return "<div class='empty-note'>No RTO entries recorded yet.</div>";

      <div class="cols">

        <div>Date<br>${fmtDate(e.date)}</div>
        <div>GPS<br>${e.gps? `<span class="gps-tag">${e.gps.lat.toFixed(4)}, ${e.gps.lng.toFixed(4)}</span>` : '—'}</div>
        <div>Photo<br>${e.photo?`<img class="thumb" src="${e.photo}">`:'—'}</div>

    </div>`).join("");

function addRtoEntry(tripId){
  openModal(`
    <h3>Add RTO entry</h3>
    <div class="field"><label>Amount (Rs)</label><input type="number" id="rt_amount"></div>
    <div class="field"><label>Date</label><input type="date" id="rt_date" value="${todayISO()}"></div>
    <div class="field"><label>Photo with GPS location</label><input type="file" accept="image/*" capture="environment" id="rt_photo"></div>
    <button class="btn secondary small" onclick="captureGps()">Tag current GPS location</button>
    <div id="rt_gpsResult" class="field-note" style="margin-top:8px;"></div>
    <button class="btn block" style="margin-top:14px;" onclick="saveRtoEntry('${tripId}')">Add RTO entry</button>

let _pendingGps = null;
function captureGps(){
  const el = document.getElementById("rt_gpsResult");
  if(!navigator.geolocation){ el.textContent = "GPS not available in this browser."; return; }
  el.textContent = "Fetching GPS location…";
  navigator.geolocation.getCurrentPosition(
    pos => { _pendingGps = {lat:pos.coords.latitude, lng:pos.coords.longitude}; el.innerHTML = `<span class="gps-tag">Tagged: ${_pendingGps.lat.toFixed(5)}, ${_pendingGps.lng.toFixed(5)}</span>`; },
    err => { el.textContent = "Could not get GPS location (" + err.message + "). Serving this page over HTTPS improves accuracy."; },
    { enableHighAccuracy:true, timeout:8000 }
  );
}
function saveRtoEntry(tripId){
  const amount = Number(document.getElementById("rt_amount").value)||0;
  const date = document.getElementById("rt_date").value || todayISO();
  const file = document.getElementById("rt_photo").files[0];
  const gps = _pendingGps;
  const finish = (photo)=>{
    mutateTrip(tripId, t=>{ t.rtoEntries.push({id:uid(), amount, date, photo:photo||null, gps, ts:Date.now()}); });
    _pendingGps = null;
    closeModal(); toast("RTO entry recorded."); openTripWorkspace(tripId);
  };
  if(file){ fileToDataUrl(file, finish); } else { finish(null); }
}
function removeRtoEntry(tripId, entryId){
  mutateTrip(tripId, t=>{ t.rtoEntries = t.rtoEntries.filter(e=>e.id!==entryId); });
  openTripWorkspace(tripId);
}

function addOtherEntry(tripId){

function saveOtherEntry(tripId){

function fileToDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

/* ---- close trip ---- */
function closeTripAndStartNext(tripId){
  const trip = getTrip(tripId);
  if(!trip.loadingLocation || !trip.unloadingLocation){
    if(!confirm("Loading or unloading details look incomplete. Close this trip anyway?")) return;
  }
  mutateTrip(tripId, t=>{ t.status="closed"; t.closedAt = Date.now(); });
  toast("Trip closed. Starting next trip — its first diesel fill will complete the previous trip's mileage calculation.");
  startTrip(trip.vehicle);
}

/* ---- calculations ---- */
function computeTripStats(trip){
  const allTrips = vehicleTrips(trip.vehicle);
  const idx = allTrips.findIndex(t=>t.id===trip.id);
  const nextTrip = allTrips[idx+1];

  const expenseTotal =
    (trip.loadingExpense||0) +
    (trip.unloadingExpense||0) +
    trip.rtoEntries.reduce((s,e)=>s+(e.amount||0),0) +
    trip.otherExpenses.reduce((s,e)=>s+(e.amount||0),0);

  const balance = (trip.advance.amount||0) - expenseTotal;

  let dieselLitres = null, km = null, mileage = null, calcNote = "";
  const fills = trip.dieselEntries;
  if(fills.length===0){
    calcNote = "No diesel fills logged for this trip yet.";
  } else if(!nextTrip || nextTrip.dieselEntries.length===0){
    calcNote = "Mileage for this trip completes once the first diesel fill of the next trip is logged.";
  } else {
    const remainingFills = fills.slice(1); // exclude 1st fill of this trip
    const closingFill = nextTrip.dieselEntries[0]; // 1st fill of next trip
    dieselLitres = remainingFills.reduce((s,e)=>s+(e.volume||0),0) + (closingFill.volume||0);
    if(fills[0].km!=null && closingFill.km!=null){
      km = closingFill.km - fills[0].km;
      mileage = dieselLitres>0 ? (km/dieselLitres) : null;
    } else {
      calcNote = "Enter odometer readings on the first fill of this trip and the first fill of the next trip to calculate KM & mileage.";
    }
  }
  const dieselValueTotal = fills.reduce((s,e)=>s+(e.value||0),0);

  return { expenseTotal, balance, dieselLitres, km, mileage, calcNote, dieselValueTotal, nextTrip };
}

function renderSettlement(trip){
  const s = computeTripStats(trip);
  return `
    <div class="summary-line"><span>Loading expense (cleaner)</span><span class="num">${fmtMoney(trip.loadingExpense)}</span></div>
    <div class="summary-line"><span>Unloading expense (cleaner)</span><span class="num">${fmtMoney(trip.unloadingExpense)}</span></div>
    <div class="summary-line"><span>RTO entries (${trip.rtoEntries.length})</span><span class="num">${fmtMoney(trip.rtoEntries.reduce((a,e)=>a+e.amount,0))}</span></div>
    <div class="summary-line"><span>Other expenses (${trip.otherExpenses.length})</span><span class="num">${fmtMoney(trip.otherExpenses.reduce((a,e)=>a+e.amount,0))}</span></div>
    <div class="summary-line total"><span>Total expense (excl. diesel)</span><span class="num">${fmtMoney(s.expenseTotal)}</span></div>
    <div class="summary-line"><span>Advance paid</span><span class="num">${fmtMoney(trip.advance.amount)}</span></div>
    <div class="summary-line total"><span>Balance (advance − expense)</span><span class="num">${fmtMoney(s.balance)}</span></div>
    <div class="section-divider">DIESEL &amp; MILEAGE</div>
    <div class="summary-line"><span>Diesel value logged this trip (all fills)</span><span class="num">${fmtMoney(s.dieselValueTotal)}</span></div>
    <div class="summary-line"><span>Diesel litres counted (excl. 1st fill + next trip's opening fill)</span><span class="num">${s.dieselLitres!=null ? s.dieselLitres.toFixed(2)+" L" : "—"}</span></div>
    <div class="summary-line"><span>Distance covered (km)</span><span class="num">${s.km!=null ? s.km+" km" : "—"}</span></div>

    ${s.calcNote ? `<div class="field-note">${s.calcNote}</div>` : ""}

}

/* ====================================================================
   REMINDERS
   ==================================================================== */
function quarterEndDate(from){
  const d = new Date(from);
  const q = Math.floor(d.getMonth()/3);
  const endMonth = q*3+2; // 0-indexed last month of quarter
  return new Date(d.getFullYear(), endMonth+1, 0); // last day of that month
}

function upcomingReminders(){
  const docs = getDocs();
  const out = [];
  const today = new Date(todayISO());
  docs.forEach(doc=>{
    const type = DOC_TYPES.find(d=>d.key===doc.type);
    if(!type) return;
    if(type.cycle==="quarterly"){
      const qEnd = quarterEndDate(today);
      const daysLeft = daysBetween(todayISO(), qEnd.toISOString().slice(0,10));
      out.push({
        vehicle: doc.vehicle, label: type.label, expiry: qEnd.toISOString().slice(0,10),
        daysLeft, status: daysLeft<=7 ? "due" : "ok",
        note: "Reminder at end of every quarter"
      });
    } else {
      const daysLeft = daysBetween(todayISO(), doc.expiryDate);
      out.push({
        vehicle: doc.vehicle, label: type.label, expiry: doc.expiryDate,
        daysLeft, status: daysLeft<0 ? "due" : (daysLeft<=(type.lead||15) ? "due" : "ok"),
        note: (type.lead||15)+" days before expiry"
      });
    }
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
}

function renderReminders(){
  const u = currentUser();
  const vList = scopedVehicles().map(v=>v.vehicle);
  const docs = getDocs().filter(d=>vList.includes(d.vehicle));
  const reminders = upcomingReminders().filter(r=>vList.includes(r.vehicle));

  document.getElementById("mainArea").innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow-num">COMPLIANCE</div><h2>Document Reminders</h2></div>
      ${u.role==='admin' ? `<button class="btn" onclick="openDocForm()">+ Add expiry date</button>` : ''}
    </div>

    ${reminders.filter(r=>r.status==='due').map(r=>`
      <div class="alert-strip"><div><b>${esc(r.vehicle)}</b> — ${r.label} ${r.daysLeft<0?`overdue by ${-r.daysLeft} day(s)`:`due in ${r.daysLeft} day(s)`} (expiry ${fmtDate(r.expiry)})</div><span class="tag">${r.note}</span></div>
    `).join("")}

    <div class="panel">
      <h3>All tracked documents</h3>
      ${docs.length===0 ? "<div class='empty-note'>No document expiry dates recorded yet.</div>" :
      `<table><thead><tr><th>Vehicle</th><th>Document</th><th>Expiry / Cycle</th><th>Status</th>${u.role==='admin'?'<th></th>':''}</tr></thead><tbody>
      ${reminders.map(r=>{
        const doc = docs.find(d=>d.vehicle===r.vehicle && DOC_TYPES.find(t=>t.key===d.type).label===r.label);
        return `<tr>
          <td class="mono">${esc(r.vehicle)}</td>
          <td>${r.label}</td>
          <td>${fmtDate(r.expiry)}</td>
          <td><span class="badge ${r.status}">${r.status==='due' ? (r.daysLeft<0?'OVERDUE':'DUE SOON') : 'OK'}</span></td>
          ${u.role==='admin' && doc ? `<td><span class="remove-x" onclick="openDocForm('${doc.id}')">edit</span> &nbsp; <span class="remove-x" onclick="deleteDoc('${doc.id}')">delete</span></td>`:(u.role==='admin'?'<td></td>':'')}
        </tr>`;
      }).join("")}
      </tbody></table>` }
    </div>

    <div class="panel">
      <h3>Reminder rules</h3>
      <table><thead><tr><th>Document</th><th>Rule</th></tr></thead><tbody>
      ${DOC_TYPES.map(t=>`<tr><td>${t.label}</td><td>${t.cycle==='quarterly' ? 'Reminder at end of every quarter' : 'Reminder ' + t.lead + ' days before expiry ('+t.cycle+')'}</td></tr>`).join("")}
      </tbody></table>
      <p class="field-note" style="margin-top:12px;">This screen shows what is due whenever the register is opened. To have reminders sent automatically by email or SMS on a schedule (without anyone opening the app), connect this system to a server-side scheduler / email service — that step needs a backend and isn't something a browser page can do on its own.</p>
    </div>
  `;
}

function openDocForm(id){
  const docs = getDocs();
  const doc = id ? docs.find(d=>d.id===id) : null;
  const vList = scopedVehicles().map(v=>v.vehicle);
  openModal(`
    <h3>${doc?"Edit document":"Add document expiry"}</h3>
    <div class="field"><label>Vehicle</label><select id="df_vehicle">${vList.map(v=>`<option ${doc&&doc.vehicle===v?'selected':''}>${v}</option>`).join("")}</select></div>
    <div class="field"><label>Document type</label>
      <select id="df_type">${DOC_TYPES.filter(t=>t.cycle!=='quarterly').map(t=>`<option value="${t.key}" ${doc&&doc.type===t.key?'selected':''}>${t.label}</option>`).join("")}</select>
    </div>
    <div class="field"><label>Expiry date</label><input type="date" id="df_expiry" value="${doc?doc.expiryDate:''}"></div>
    <button class="btn block" onclick="saveDoc('${doc?doc.id:''}')">${doc?"Save changes":"Add document"}</button>
    <p class="field-note">Q-Tax is tracked automatically every quarter and doesn't need an expiry date here.</p>
  `);
}
function saveDoc(id){
  const vehicle = document.getElementById("df_vehicle").value;
  const type = document.getElementById("df_type").value;
  const expiryDate = document.getElementById("df_expiry").value;
  if(!vehicle || !expiryDate){ toast("Vehicle and expiry date are required."); return; }
  let docs = getDocs();
  if(id){
    docs = docs.map(d=> d.id===id ? {...d, vehicle, type, expiryDate} : d);
  } else {
    docs.push({ id: uid(), vehicle, type, expiryDate });
  }
  saveDocs(docs);
  closeModal(); toast("Saved."); renderReminders();
}
function deleteDoc(id){
  if(!confirm("Delete this reminder?")) return;
  saveDocs(getDocs().filter(d=>d.id!==id));
  renderReminders();
}

/* also make sure Q-Tax reminders exist implicitly per vehicle without needing a stored record */
function ensureQTaxTracking(){
  // Q-Tax is computed live in upcomingReminders() for every vehicle that has at least one other doc,
  // but we also want it for vehicles with none yet — add a synthetic pass in renderReminders via customers list.
}
const _origUpcoming = upcomingReminders;
upcomingReminders = function(){
  const results = _origUpcoming();
  const customers = getCustomers();
  const allVehicles = customers.flatMap(c=>c.vehicles);
  const today = new Date(todayISO());
  allVehicles.forEach(v=>{
    if(!results.some(r=>r.vehicle===v && r.label==="Q-Tax")){
      const qEnd = quarterEndDate(today);
      const daysLeft = daysBetween(todayISO(), qEnd.toISOString().slice(0,10));
      results.push({ vehicle:v, label:"Q-Tax", expiry:qEnd.toISOString().slice(0,10), daysLeft, status: daysLeft<=7?"due":"ok", note:"Reminder at end of every quarter" });
    }
  });
  return results.sort((a,b)=>a.daysLeft-b.daysLeft);
};

   COMPANY SETTINGS (logo)
   ==================================================================== */

    <div class="page-head">
      <div><div class="eyebrow-num">BRANDING</div><h2>Company Settings</h2></div>
    </div>
    <div class="panel">
      <h3>Company logo</h3>
      ${logo ? `
        <div class="logo-preview-current">
          <img src="${logo}" alt="Current logo">
          <div>
            <div class="field-note">${isCustom ? "Custom uploaded logo" : "Default KPS Technology logo"} — shown on the login screen, the sidebar, and printed trip reports.</div>
            <div class="flexrow" style="margin-top:8px;">
              <button class="btn secondary small" onclick="removeLogo()">Remove logo</button>
              ${isCustom ? `<button class="btn secondary small" onclick="restoreDefaultLogo()">Restore default KPS logo</button>` : ''}
            </div>
          </div>
        </div>
      ` : `<div class="field-note" style="margin-bottom:14px;">No logo shown right now — "KPS TECHNOLOGY" text is used instead.</div>
        ${isRemoved ? `<button class="btn secondary small" style="margin-bottom:14px;" onclick="restoreDefaultLogo()">Restore default KPS logo</button>` : ''}`}
      <div class="logo-upload-box">
        <div class="field-note" style="margin-bottom:10px;">Upload a PNG, JPG or SVG to replace the logo above. A transparent background works best.</div>
        <input type="file" accept="image/*" id="logoFile">
        <div style="margin-top:12px;"><button class="btn small" onclick="uploadLogo()">Save logo</button></div>
      </div>
    </div>
  `;
}
function uploadLogo(){
  const file = document.getElementById("logoFile").files[0];
  if(!file){ toast("Choose an image file first."); return; }
  fileToDataUrl(file, (dataUrl)=>{
    if(!dataUrl){ toast("Could not read that file."); return; }
    saveLogo(dataUrl);
    renderLogoSlots();
    toast("Logo saved.");
    renderSettings();
  });
}
function removeLogo(){
  if(!confirm("Remove the logo and show text instead?")) return;
  saveLogo("");
  renderLogoSlots();
  renderSettings();
}
function restoreDefaultLogo(){
  localStorage.removeItem("kps_logo");
  renderLogoSlots();
  toast("Default KPS Technology logo restored.");
  renderSettings();
}

/* ---------------- utils ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- init ---------------- */
boot();
