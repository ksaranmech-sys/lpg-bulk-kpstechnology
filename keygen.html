<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>License Key Generator — Developer Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#1B2430; --paper:#F7F5F0; --amber:#F2A93B; --line:#D8D3C6;
  }
  body{font-family:"Courier New",monospace;background:var(--ink);color:var(--paper);
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;}
  .box{background:var(--paper);color:var(--ink);max-width:460px;width:100%;padding:32px;border:1px solid var(--line);}
  h1{font-size:1.05rem;letter-spacing:.02em;margin:0 0 4px;}
  p.sub{margin:0 0 24px;color:#5B6472;font-size:.85rem;}
  label{display:block;font-size:.8rem;margin:14px 0 4px;}
  input,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:.9rem;}
  button{margin-top:20px;width:100%;padding:11px;background:var(--ink);color:var(--amber);border:none;font-family:inherit;font-size:.9rem;cursor:pointer;letter-spacing:.03em;}
  button:hover{background:#2b384b;}
  .result{margin-top:22px;padding:16px;border:1px dashed var(--amber);background:#fffaf0;display:none;}
  .result.show{display:block;}
  .key{font-size:1.1rem;font-weight:bold;word-break:break-all;color:var(--ink);}
  .exp{margin-top:6px;color:#5B6472;font-size:.85rem;}
  .copybtn{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:6px 10px;font-size:.75rem;}
</style>
</head>
<body>
  <div class="box">
    <h1>License key generator</h1>
    <p class="sub">Developer-only tool. Do not give this file to customers — give them only the generated key string.</p>

    <label for="cid">Customer COMPANY_ID (from that customer's config.js)</label>
    <input id="cid" placeholder="e.g. DEMO-TRANS-001">

    <label for="years">Renewal length</label>
    <select id="years">
      <option value="1">1 year</option>
      <option value="2">2 years</option>
      <option value="3">3 years</option>
    </select>

    <button onclick="doGenerate()">Generate key</button>

    <div class="result" id="result">
      <div class="key" id="keyOut"></div>
      <div class="exp" id="expOut"></div>
      <button class="copybtn" onclick="copyKey()">Copy key</button>
    </div>
  </div>

<script src="license.js"></script>
<script>
  function doGenerate(){
    const cid = document.getElementById('cid').value.trim();
    if(!cid){ alert('Enter the customer COMPANY_ID first.'); return; }
    const years = parseInt(document.getElementById('years').value, 10);
    const { key, expiry } = LicenseKit.generate(cid, years);
    document.getElementById('keyOut').textContent = key;
    document.getElementById('expOut').textContent = `Valid until ${expiry} for COMPANY_ID "${cid}"`;
    document.getElementById('result').classList.add('show');
  }
  function copyKey(){
    const txt = document.getElementById('keyOut').textContent;
    navigator.clipboard.writeText(txt).then(()=> alert('Key copied.'));
  }
</script>
</body>
</html>
