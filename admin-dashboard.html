<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KPS Technology - Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <h1><img src="/img/logo.jpg" alt="" style="height:28px;vertical-align:middle;border-radius:50%;margin-right:8px;">KPS Technology - Super Admin</h1>
    <button onclick="logout()">Log Out</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Add New Customer</h2>
      <div class="row">
        <div><label>Company / Customer Name</label><input id="c_name"></div>
        <div><label>Mobile Number</label><input id="c_mobile"></div>
        <div><label>Customer Email Address</label><input id="c_email" type="email"></div>
      </div>
      <div class="row">
        <div><label>Admin Username (for this customer)</label><input id="c_username"></div>
        <div><label>Admin Password</label><input id="c_password" type="text"></div>
      </div>
      <button class="primary" onclick="createCustomer()">Create Customer</button>
      <div id="msg" class="msg"></div>
      <div id="err" class="error"></div>
    </div>

    <div class="card">
      <h2>Existing Customers</h2>
      <table>
        <thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Created</th></tr></thead>
        <tbody id="customerRows"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
